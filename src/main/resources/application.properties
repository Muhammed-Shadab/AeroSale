spring.application.name=AeroScale

# Bind to Render's dynamic port, default to 8080 locally
server.port=${PORT:8080}

# Database Connection Settings
spring.datasource.url=${DB_URL}

spring.datasource.username=${DB_USERNAME}

spring.datasource.password=${DB_PASS}

spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# accesstoken setting
jwt.secret=${JWT_SEC}
jwt.access-token-expiration-ms=90000000
jwt.issuer=AeroScale-auth-service

#refreshToken setting
jwt.refresh-token-expiration-ms=604800000
jwt.refresh-token-byteLength=64

#paymentSystem
razorpay-key=${RZR_KEY}
razorpay-secret-key=${RZP_SEC}


#Claudinary Settings

cloudinary.cloud-name=${CLD_NAME}
cloudinary.api-key=${CLD_KEY}
cloudinary.api-secret=${CLD_SEC}

# CORS settings (supports comma-separated list of origins)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://aero-scale-frontend.vercel.app,http://localhost:5173}
