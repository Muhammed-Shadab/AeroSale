spring.application.name=AeroScale

# Database Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/AeroScale
spring.datasource.username=postgres
spring.datasource.password=xxyy


# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# accesstoken setting
jwt.secret=xxyy
jwt.access-token-expiration-ms=90000000
jwt.issuer=AeroScale-auth-service

#refreshToken setting
jwt.refresh-token-expiration-ms=604800000
jwt.refresh-token-byteLength=64

#paymentSystem
razorpay-key=xxyy
razorpay-secret-key=xxyy


#Claudinary Settings

cloudinary.cloud-name=xxyy
cloudinary.api-key=xxyy
cloudinary.api-secret=xxyy
